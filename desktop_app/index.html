<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Accstool</title>
    <style>
        .tab-container {
            margin-bottom: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: #2B2B2B;
            border-radius: 4px;
            color: #FCB929;
            transition: background-color 0.3s, color 0.3s;
        }

        .tab-button.active {
            background: #FCB929;
            color: #2B2B2B;
        }

        .tab-content {
            display: block;
            opacity: 0.5;
            transition: opacity 0.6s ease;
        }

        .tab-content.active {
            opacity: 1;
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 10px;
            color: #666;
        }

        .form-disabled {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <header>
        Accstool App
    </header>

    <div id="appContainer">
        <div class="tab-container">
            <!-- <div class="tab-buttons">
                <button class="tab-button active" data-tab="products">Products</button>
            </div> -->

            <div id="productsTab" class="tab-content active">
                <h1>Available Products</h1>
                <div class="input-group">
                    <div class="input-field">
                        <label for="customerEmail">Customer Email:</label>
                        <input type="email" id="customerEmail" placeholder="example@gmail.com">
                    </div>

                    <div class="input-field">
                        <label for="password">Password:</label>
                        <input type="text" id="password" placeholder="Enter your password">
                    </div>
                </div>
                <button id="fetchProducts">Login</button>
                <div class="forgot-password">
                    <a href="reset-password.html">Forgot Password?</a>
                </div>

                <!-- Loading spinner -->
                <div id="loadingSpinner" class="loading-spinner">
                    <div class="spinner"></div>
                    <div class="loading-text">Fetching products...</div>
                </div>

                <div id="productsContainer"></div>
            </div>
        </div>
    </div>

    <footer>
        <ul class="social-links">
            <li><a href="#" onclick="electronAPI.openExternalUrl('https://wa.me/+8801792510932'); return false;">
                    <!-- <img src="./assets/whatsapp.png" alt="WhatsApp"> -->
                    <span>WhatsApp</span>
                </a></li>
            <li><a href="#" onclick="electronAPI.openExternalUrl('https://www.facebook.com/accstool'); return false;">
                    <!-- <img src="./assets/facebook.png" alt="Facebook"> -->
                    <span>Facebook</span>
                </a></li>
        </ul>
        <p>&copy; 2024 Accstool App. All Rights Reserved.</p>
        <p>Developed by <a href="#"
                onclick="electronAPI.openExternalUrl('https://fusionpulsetech.com'); return false;">Fusion Pulse
                Tech</a></p>
    </footer>

    <script>
        // Listen for URL blocked errors
        window.electronAPI.onUrlBlockedError(({ message, url }) => {
            alert(`${message}\nBlocked URL: ${url}`);
        });

        // Tab switching functionality
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons and contents
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

                // Add active class to clicked button and corresponding content
                button.classList.add('active');
                const tabId = button.getAttribute('data-tab') + 'Tab';
                document.getElementById(tabId).classList.add('active');
            });
        });

        document.addEventListener('DOMContentLoaded', async () => {
            // Load saved credentials when the page loads
            const credentials = await window.electronAPI.getSavedCredentials();
            document.getElementById('customerEmail').value = credentials.email || '';
            document.getElementById('password').value = credentials.password || '';

            document.getElementById('fetchProducts').addEventListener('click', async () => {
                const email = document.getElementById('customerEmail').value;
                const password = document.getElementById('password').value;
                const loginForm = document.getElementById('fetchProducts');
                const loadingSpinner = document.getElementById('loadingSpinner');
                const productsContainer = document.getElementById('productsContainer');

                try {
                    // Show loading state
                    loginForm.classList.add('form-disabled');
                    loadingSpinner.style.display = 'block';
                    productsContainer.innerHTML = '';

                    // Save credentials and fetch products
                    await window.electronAPI.saveCredentials(email, password);
                    const products = await window.electronAPI.getActiveProducts(email, password);
                    displayProducts(products);
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to fetch products. Please check your credentials.');
                } finally {
                    // Hide loading state
                    loginForm.classList.remove('form-disabled');
                    loadingSpinner.style.display = 'none';
                }
            });
        });

        // Function to display products
        function displayProducts(products) {
            const productsContainer = document.getElementById('productsContainer');

            if (products && products.length > 0) {
                productsContainer.innerHTML = products.map(product => `
                    <div class="product-item">
                        <h3>${product.productTitle}</h3>
                        <p><strong>Status:</strong> ${product.status}</p>
                        <p><strong>Remaining Days:</strong> ${product.remainingDays}</p>
                        ${product.status === 'active' ?
                        `<button onclick='openProduct(${JSON.stringify(product.productUrl)}, ${JSON.stringify(product.productCookie)})'>
                                Open Product
                            </button>` :
                        '<button disabled>Expired</button>'
                    }
                    </div>
                `).join('');
            } else {
                productsContainer.innerHTML = '<p>No active products found.</p>';
            }
        }

        // Function to open product URL with cookies
        async function openProduct(url, cookies) {
            try {
                await window.electronAPI.openUrlWithCookies(url, cookies);
            } catch (error) {
                console.error('Error opening product:', error);
                alert('Error opening product. Please try again.');
            }
        }
    </script>
</body>

</html>
